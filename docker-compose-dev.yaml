services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-hub-platform-postgres
    environment:
      POSTGRES_DB: KnowledgeHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d KnowledgeHub"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:8-alpine
    container_name: knowledge-hub-platform-redis
    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data: