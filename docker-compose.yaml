services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: KnowledgeHub

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/KnowledgeHub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - monitoring

    restart: unless-stopped


  postgres:
    image: pgvector/pgvector:pg17
    container_name: knowledge-hub-platform-postgres

    environment:
      POSTGRES_DB: KnowledgeHub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d KnowledgeHub"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - monitoring

    restart: unless-stopped


  redis:
    image: redis:8-alpine
    container_name: knowledge-hub-platform-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - monitoring

    restart: unless-stopped


  minio:
    image: elestio/minio:latest
    container_name: knowledge-hub-docs

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    networks:
      - monitoring


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - monitoring

    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - monitoring

    restart: unless-stopped


networks:
  monitoring:
    driver: bridge


volumes:
  postgres_data:
  redis_data:
  minio_data: